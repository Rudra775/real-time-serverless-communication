events {
    worker_connections 1024;
}

http {
    upstream go_app {
        server server_a:8080;
        server server_b:8080;
        keepalive 32; 
    }

    server {
        listen 80;

        # Serve static frontend (index.html)
        location = / {
            proxy_pass http://go_app;
        }

        # SSE Connection endpoint (Publicly exposed)
        location /connect {
            proxy_pass http://go_app;
            
            # SSE Specifics
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_set_header X-Accel-Buffering no;

            # Timeouts - Crucial for long-lived streams
            proxy_read_timeout 24h;
            proxy_send_timeout 24h;

            # Forwarding Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Client Acknowledgment endpoint (Publicly exposed, secure)
        location /ack {
            proxy_pass http://go_app;
        }

        # Administrative publishing (Secured by API Key in Go, should be restricted in production Nginx)
        location /send {
            proxy_pass http://go_app;
        }

        # Health endpoint
        location /health {
            proxy_pass http://go_app;
        }

        # Nginx internal status
        location /nginx_status {
            stub_status on;
            allow 127.0.0.1; 
            deny all;
        }
    }
}