version: '3.8'

services:
  realtime_redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # --- THE LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80" # Exposed to your browser
    depends_on:
      - server_a
      - server_b

  server_a:
    build: .
    environment:
      - REDIS_ADDR=realtime_redis:6379
    # remove "ports" section here if you want to force traffic through Nginx
    # or keep them for debugging (8080:8080)
    expose:
      - "8080" # Only visible inside Docker network
    depends_on:
      - realtime_redis

  server_b:
    build: .
    environment:
      - REDIS_ADDR=realtime_redis:6379
    expose:
      - "8080"
    depends_on:
      - realtime_redis