version: "3.8"

services:
  realtime_redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # --- THE LOAD BALANCER ---
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80" # Exposed to your browser
    depends_on:
      - server_a
      - server_b

server_a:
  build: .
  environment:
    - REDIS_ADDR=realtime_redis:6379
  expose:
    - "8080"
  depends_on:
    - realtime_redis
  healthcheck: # ← Add this
    test:
      [
        "CMD",
        "wget",
        "--quiet",
        "--tries=1",
        "--spider",
        "http://localhost:8080/health",
      ]
    interval: 10s
    timeout: 3s
    retries: 3

  server_b:
    build: .
    environment:
      - REDIS_ADDR=realtime_redis:6379
    expose:
      - "8080"
    depends_on:
      - realtime_redis
